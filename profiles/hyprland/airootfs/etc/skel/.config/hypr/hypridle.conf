# Archuseriso Hyprland live defaults.
# Lock the session on idle; do not suspend (live/rescue medium).

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
}

# Dim is not used; lock after 5 minutes of inactivity.
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}
