# Archuseriso Hyprland live defaults.
# Screen lock is disabled on the live medium (no hyprlock / idle lock).
# Packages hypridle/hyprlock remain installed if you want to re-enable later.
# Example:
#   general { lock_cmd = pidof hyprlock || hyprlock }
#   listener { timeout = 300; on-timeout = loginctl lock-session }

general {
    ignore_dbus_inhibit = false
}
