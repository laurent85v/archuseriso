# Archuseriso minimal hyprlock config for the live session.
# Password is empty for the live user; Enter unlocks.

$font = monospace

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
}

background {
    monitor =
    path = /usr/share/hypr/wall1.png
    blur_passes = 2
    brightness = 0.6
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2
    outer_color = rgba(33ccffee)
    inner_color = rgba(0, 0, 0, 0.4)
    font_color = rgb(220, 220, 220)
    fade_on_empty = true
    rounding = 12
    font_family = $font
    placeholder_text = <i>Password (empty on live)…</i>
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    position = 0, -40
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = 72
    font_family = $font
    color = rgba(255, 255, 255, 0.9)
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = Archuseriso Hyprland
    font_size = 16
    font_family = $font
    color = rgba(200, 200, 200, 0.85)
    position = 0, 20
    halign = center
    valign = center
}
